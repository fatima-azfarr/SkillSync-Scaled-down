<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="ss-bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="ss-mint-grad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="48" height="48" rx="12" fill="url(#ss-bg-grad)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Interlocking Sync 'S' Mark -->
  <g filter="url(#ss-glow)">
    <!-- Primary Loop (White) -->
    <path d="M28 14H18C15.2386 14 13 16.2386 13 19C13 21.7614 15.2386 24 18 24H30C32.7614 24 35 26.2386 35 29C35 31.7614 32.7614 34 30 34H18" 
          stroke="#FFFFFF" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Sync Arrow Head (Top Loop) -->
    <path d="M25 11L28.5 14L25 17" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Counter Loop (Electric Mint) -->
    <path d="M20 34H30C32.7614 34 35 31.7614 35 29C35 26.2386 32.7614 24 30 24" 
          stroke="url(#ss-mint-grad)" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <!-- Sync Arrow Head (Bottom Loop) -->
    <path d="M23 37L19.5 34L23 31" 
          stroke="url(#ss-mint-grad)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Sync Node -->
    <circle cx="24" cy="24" r="2.2" fill="#5EEAD4"/>
  </g>
</svg>
