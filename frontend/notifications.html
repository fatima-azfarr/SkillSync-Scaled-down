<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SkillSync — Notifications. Real-time alerts on new matches, scraper syncs, deadlines, and skill gaps.">
    <title>SkillSync — Notifications</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Theme (load early to prevent flash) -->
    <script src="js/theme.js"></script>
</head>
<body>
    <div class="app-layout">
        
        <!-- ═══════════ SIDEBAR ═══════════ -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                Skill<span>Sync</span>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-nav-top">
                    <a href="index.html" class="nav-item">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        </span>
                        Dashboard
                    </a>
                    <a href="browse.html" class="nav-item">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                        </span>
                        Discover
                    </a>
                    <a href="notifications.html" class="nav-item active">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        </span>
                        Notifications
                        <span class="nav-badge" id="sidebar-notif-badge">2</span>
                    </a>
                    <a href="profile.html" class="nav-item">
                        <span class="nav-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        Profile
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button class="sidebar-footer-item" id="theme-toggle">
                    <svg class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <span>Dark mode</span>
                </button>

                <button class="sidebar-footer-item" id="sidebar-logout-btn" style="color:var(--text-secondary);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Sign out</span>
                </button>

                <div class="sidebar-user" id="sidebar-user-badge">
                    <div class="user-avatar" id="sidebar-user-avatar">F</div>
                    <div class="user-info">
                        <div class="user-name" id="sidebar-user-name">Fatima</div>
                        <div class="user-email" id="sidebar-user-email">fa23-bcs-185@cuilahore.edu.pk</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ═══════════ MAIN ═══════════ -->
        <div class="main-content">

            <!-- Header -->
            <header class="top-header">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="header-search" 
                           placeholder="Search opportunities...">
                </div>

                <select class="header-domain-filter" id="header-domain" onchange="window.location.href='index.html'">
                    <option value="">All domains</option>
                    <option value="Web Development">Web Development</option>
                    <option value="AI">AI</option>
                    <option value="NLP">NLP</option>
                    <option value="DevOps">DevOps</option>
                    <option value="Open Source">Open Source</option>
                    <option value="Data Science">Data Science</option>
                </select>

                <!-- Notification Bell -->
                <button class="header-notification" id="header-notification-btn" aria-label="Notifications" title="Notifications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="badge" id="header-notif-badge">2</span>
                </button>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <div class="notifications-container">
                    
                    <!-- Notifications Header -->
                    <div class="notifications-header">
                        <div>
                            <h1 class="notifications-title">Notifications</h1>
                            <p class="notifications-subtitle"><span id="unread-count">2</span> unread</p>
                        </div>
                        <button class="btn-mark-all-read" id="btn-mark-all-read">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            Mark all read
                        </button>
                    </div>

                    <!-- Notifications List -->
                    <div class="notifications-list" id="notifications-list">
                        <div class="loading-container">
                            <div class="spinner"></div>
                            <p>Loading notifications...</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
